<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Space Details — ParkEase</title>
  <meta name="description" content="Book this parking space by the hour. Secure, affordable, instant confirmation.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/listing.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <!-- Loading State -->
  <div id="page-loading" style="padding-top: 120px;">
    <div class="container" style="display: flex; gap: 2rem;">
      <div style="flex:2">
        <div class="skeleton" style="height: 400px; border-radius: var(--radius-lg); margin-bottom: 1.5rem;"></div>
        <div class="skeleton" style="height: 200px; border-radius: var(--radius-lg);"></div>
      </div>
      <div style="flex:1">
        <div class="skeleton" style="height: 450px; border-radius: var(--radius-lg);"></div>
      </div>
    </div>
  </div>

  <!-- Main Content (hidden until loaded) -->
  <div id="page-content" class="hidden" style="padding-top: 80px;">
    <div class="container listing-layout">

      <!-- Left Column -->
      <div class="listing-main">
        <!-- Image -->
        <div class="listing-image-wrap">
          <img id="listing-img" src="" alt="Parking Space" class="listing-img">
          <div class="listing-img-overlay">
            <span class="tag tag-success" id="listing-status-tag">● Available</span>
          </div>
        </div>

        <!-- Info -->
        <div class="listing-info card">
          <div class="listing-header">
            <div>
              <div class="breadcrumb" style="margin-bottom: 0.5rem;">
                <a href="search.html">← Back to Search</a>
              </div>
              <h1 id="listing-title">Loading...</h1>
              <div class="listing-address" id="listing-address">
                <span>📍</span><span></span>
              </div>
              <div class="listing-meta" id="listing-meta">
                <span class="tag tag-accent" id="listing-vehicle"></span>
                <span class="tag" id="listing-spots"></span>
                <span class="tag" id="listing-hours"></span>
              </div>
            </div>
            <div class="listing-price-block">
              <div class="listing-price" id="listing-price">₹0</div>
              <div class="listing-per">per hour</div>
            </div>
          </div>

          <!-- Rating -->
          <div class="listing-rating" id="listing-rating"></div>

          <!-- Description -->
          <div class="divider"></div>
          <div class="listing-description" id="listing-description"></div>

          <!-- Map -->
          <div class="divider"></div>
          <h3 style="margin-bottom: 1rem;">📍 Location</h3>
          <div class="listing-map" id="listing-map">
            <iframe id="map-iframe" width="100%" height="300" style="border:0; border-radius: var(--radius-md);"
              allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
          </div>
        </div>

        <!-- Reviews Section -->
        <div class="card" style="padding: 1.75rem; margin-top: 1.5rem;" id="reviews-card">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
            <h3 id="reviews-heading">Reviews</h3>
            <button class="btn btn-outline btn-sm" onclick="openReviewModal()" id="write-review-btn" style="display:none;">
              ✍️ Write Review
            </button>
          </div>
          <div id="reviews-list">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <!-- Right Column — Booking Widget -->
      <div class="listing-sidebar">
        <div class="booking-widget card" id="booking-widget">
          <h3>Book This Space</h3>
          <div class="booking-price-display" id="bw-price">₹0 <span>/hr</span></div>

          <form id="booking-form" onsubmit="submitBooking(event)">
            <div class="form-group">
              <label class="form-label">Start Time <span class="required">*</span></label>
              <input type="datetime-local" id="book-start" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">End Time <span class="required">*</span></label>
              <input type="datetime-local" id="book-end" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Vehicle Number</label>
              <input type="text" id="book-vehicle" class="form-control" placeholder="e.g. KA01AB1234" maxlength="15">
            </div>

            <!-- Cost Breakdown (shown after dates selected) -->
            <div class="booking-breakdown hidden" id="booking-breakdown">
              <div class="breakdown-row"><span>Duration</span><span id="bd-duration">—</span></div>
              <div class="breakdown-row"><span>Rate</span><span id="bd-rate">—</span></div>
              <div class="divider" style="margin: 0.5rem 0;"></div>
              <div class="breakdown-row total"><span>Total</span><span id="bd-total">—</span></div>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg" id="book-btn">
              🅿️ Book & Pay
            </button>
            <p class="booking-note">You'll be taken to payment after booking</p>
          </form>

          <div class="booking-features">
            <div class="bk-feature"><span>✅</span> Instant confirmation</div>
            <div class="bk-feature"><span>🔒</span> Secure payment</div>
            <div class="bk-feature"><span>❌</span> Free cancellation</div>
          </div>
        </div>

        <!-- Owner Card -->
        <div class="owner-card card" id="owner-card">
          <div class="owner-avatar" id="owner-avatar"></div>
          <div>
            <div class="form-label">Space Owner</div>
            <div id="owner-name" style="font-weight: 600;"></div>
            <div id="owner-since" style="font-size: 0.8rem; color: var(--text-muted);"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal-overlay hidden" id="review-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Write a Review</h3>
        <button class="modal-close" onclick="closeReviewModal()">✕</button>
      </div>
      <form onsubmit="submitReview(event)">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label">Rating</label>
          <div class="star-rating" id="review-stars">
            <span class="star" data-val="1" onclick="setRating(1)">★</span>
            <span class="star" data-val="2" onclick="setRating(2)">★</span>
            <span class="star" data-val="3" onclick="setRating(3)">★</span>
            <span class="star" data-val="4" onclick="setRating(4)">★</span>
            <span class="star" data-val="5" onclick="setRating(5)">★</span>
          </div>
          <input type="hidden" id="review-rating" value="0">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label">Comment (optional)</label>
          <textarea id="review-comment" class="form-control" rows="3" placeholder="Share your experience..."></textarea>
        </div>
        <input type="hidden" id="review-booking-id">
        <button type="submit" class="btn btn-primary btn-full" id="review-submit-btn">Submit Review</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/listing.js"></script>
</body>
</html>
